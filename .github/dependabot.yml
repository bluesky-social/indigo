version: 2

updates:
  - package-ecosystem: docker
    directories:
      - "/cmd/*"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      docker-base-images:
        group-by: dependency-name
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directories:
      - "/cmd/*"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      compose-images:
        group-by: dependency-name
        patterns:
          - "*"
    ignore:
      # These are application snapshots, not independently versioned bases.
      - dependency-name: ghcr.io/bluesky-social/atproto
      - dependency-name: ghcr.io/bluesky-social/did-method-plc
      - dependency-name: ghcr.io/bluesky-social/indigo
