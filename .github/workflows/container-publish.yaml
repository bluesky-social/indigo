name: container-publish

on:
  push:
    branches:
      - main
      - bnewbold/automod
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .dockerignore
      - cmd/**
      - .github/workflows/container-publish.yaml
      - .github/scripts/container-matrix.mjs

permissions:
  contents: read

jobs:
  select:
    if: github.repository == 'bluesky-social/indigo' && !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has-images: ${{ steps.select.outputs.has-images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select changed images
        id: select
        run: node .github/scripts/container-matrix.mjs

  publish:
    name: container-${{ matrix.service }}-${{ matrix.registry }}
    needs: select
    if: needs.select.outputs.has-images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Log into AWS registry
        if: matrix.registry == 'aws'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AWS_ECR_REGISTRY_USEAST2_PACKAGES_REGISTRY }}
          username: ${{ secrets.AWS_ECR_REGISTRY_USEAST2_PACKAGES_USERNAME }}
          password: ${{ secrets.AWS_ECR_REGISTRY_USEAST2_PACKAGES_PASSWORD }}
      - name: Log into GHCR
        if: matrix.registry == 'ghcr'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.registry == 'aws' && format('{0}/{1}', secrets.AWS_ECR_REGISTRY_USEAST2_PACKAGES_REGISTRY, matrix.image) || format('ghcr.io/{0}', matrix.image) }}
          tags: |
            type=sha,enable=true,priority=100,prefix=${{ matrix.tagPrefix }},suffix=,format=long
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.registry }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.registry }}
